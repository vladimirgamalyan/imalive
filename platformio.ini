; imalive — ESP32-C3 SuperMini firmware (PlatformIO / Arduino)
; See CONCEPT.md and docs/adr/ for the design.

[env:esp32-c3-supermini]
platform = espressif32@6.9.0
; The SuperMini has no dedicated PlatformIO board id; the generic C3 DevKitM-1
; definition matches the ESP32-C3 and works for this board.
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

; Route Serial to the native USB (USB Serial/JTAG) so logs appear over USB.
; On ESP32-C3 both flags are required: USB_MODE=1 selects the HWCDC (Serial/JTAG)
; path, CDC_ON_BOOT=1 maps `Serial` onto it.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
